services:
  - type: web
    name: cloudvuln-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "gunicorn -c backend/gunicorn.conf.py backend.main:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: 8000
      - key: BIND
        value: 0.0.0.0:8000
      - key: SECRET_KEY
        generateValue: true
      - key: REFRESH_SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://cloudvuln-frontend.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        value: "sqlite:////var/data/cloudvuln.db"
    disk:
      name: cloudvuln-data
      mountPath: /var/data
      sizeGB: 1
